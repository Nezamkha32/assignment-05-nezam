
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issues Tracker | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <nav class="flex justify-between items-center bg-white p-4 shadow">
    <h1 class="text-xl font-bold flex items-center">
      <img class="w-6 mr-2" src="./assets/github-logo.png" alt="Logo"> GitHub Issues Tracker
    </h1>
    <div class="flex gap-2">
      <input id="searchInput" type="text" placeholder="🔍 Search issues..." class="input input-bordered rounded-full">
      <button id="searchBtn" class="btn btn-primary rounded-full">➕ New Issue</button>
    </div>
  </nav>

  <!-- Header Section -->
  <section class="flex justify-between items-center bg-white shadow p-6 m-6 rounded-lg">
    <div class="flex items-center gap-4">
      <img src="./assets/aperture.png" alt="Aperture Icon" class="w-12 h-12">
      <div>
        <p class="font-bold text-lg">50 Issues</p>
        <p class="text-gray-500">Track and manage your project issues</p>
      </div>
    </div>
    <div class="flex gap-6">
      <p class="text-green-600 font-semibold">Open</p>
      <p class="text-purple-600 font-semibold">Closed</p>
    </div>
  </section>

  <!-- Tabs -->
  <div class="flex justify-center gap-4 m-6">
    <button class="btn btn-outline btn-primary" id="allBtn">All</button>
    <button class="btn btn-outline btn-primary" id="openBtn">Open</button>
    <button class="btn btn-outline btn-primary" id="closedBtn">Closed</button>
  </div>

  <!-- Spinner -->
  <div id="spinner" class="hidden text-center mt-6">
    <span class="loading loading-dots loading-lg"></span>
  </div>

  <!-- Issues Grid -->
  <div id="issuesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6"></div>

  <!-- Modal -->
  <dialog id="issueModal" class="modal">
    <div class="modal-box">
      <div class="flex justify-between items-start mb-4">
        <h3 id="modalTitle" class="font-bold text-xl"></h3>
        <button class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('issueModal').close()">✕</button>
      </div>
      <p id="modalDesc" class="mb-4"></p>
      <p><span class="font-bold">Author:</span> <span id="modalAuthor"></span></p>
      <p><span class="font-bold">Category:</span> <span id="modalCategory"></span></p>
      <p><span class="font-bold">Priority:</span> <span id="modalPriority"></span></p>
      <p><span class="font-bold">Status:</span> <span id="modalStatus"></span></p>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn">Close</button>
        </form>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
